name: grade

# The GRADING PLANE. Pure Python (numpy/nibabel/scipy) — runs on github-hosted runners,
# with no neuroimaging stack and no dependency on whatever environment ran the task. Reference NIfTIs are pulled from the Hugging Face dataset
# neurodeskorg/skills-comm-ground-truth at a pinned revision. Access is gated, so the grading
# job reads a token from the HF_TOKEN secret. The execution plane never gets one.
# into each pack's reference/ dir; they are NEVER committed and NEVER exposed to the agent.
#
# Two entry points:
#   * grade         — reusable (workflow_call) + manual: score ONE submission produced by the
#                     execution plane, emit a ranked-ready envelope JSON as an artifact.
#   * selftest      — on every push touching the harness/packs: synthesise a perfect and a
#                     broken submission FROM the reference and assert the grader agrees.
#                     Guards the grading contract with zero dependency on the execution plane.

on:
  workflow_dispatch:
    inputs:
      task:
        description: task_id (must exist in benchmark/harness/run_manifest.json)
        required: true
      model:
        description: model label (e.g. qwen, glm, minimax)
        required: true
      condition:
        description: baseline | skill
        required: true
        default: baseline
      submission_artifact:
        description: name of the uploaded artifact holding submission/output.nii.gz
        required: true
  workflow_call:
    inputs:
      task:        { required: true,  type: string }
      model:       { required: true,  type: string }
      condition:   { required: true,  type: string, default: baseline }
      submission_artifact: { required: true, type: string }
  push:
    paths:
      - benchmark/harness/**
      - benchmark/graders/**
      - .github/workflows/grade.yml

concurrency:
  group: grade-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- production grading
  grade:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install grading dependencies
        run: pip install --quiet numpy nibabel scipy huggingface_hub

      - name: Download the agent submission
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.submission_artifact }}
          path: run            # expects run/submissions/<task_id>/output.nii.gz

      - name: Fetch reference (grader-side only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python benchmark/harness/fetch_reference.py --task "${{ inputs.task }}"

      - name: Grade
        run: |
          mkdir -p results
          python benchmark/harness/grade_wrapper.py grade \
            --task "${{ inputs.task }}" \
            --submission-dir run \
            --model "${{ inputs.model }}" \
            --condition "${{ inputs.condition }}" \
            --out "results/${{ inputs.task }}__${{ inputs.model }}__${{ inputs.condition }}.json"

      - name: Upload envelope
        uses: actions/upload-artifact@v4
        with:
          name: grade-${{ inputs.task }}-${{ inputs.model }}-${{ inputs.condition }}
          path: results/*.json

  # ---------------------------------------------------------------- self-test the plane
  selftest:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One row per scorer shape. Every graded task is now per subject, so the
          # single-reference path through fetch_reference is no longer covered here:
          # the two tasks that still use it are registrations, whose reference is a
          # template, and this selftest works by copying the graded reference as a
          # perfect submission -- which is not a perfect answer to a registration.
          # Restoring that coverage needs a selftest those tasks can satisfy.
          - task: clinical-wmh-segmentation
            graded_ref: lesion_mask.nii.gz          # expert reference, graded per case
            case: case-302
          - task: structural-tissue-segmentation-7t
            graded_ref: consensus_seg.nii.gz        # multiclass scorer, graded per case
            case: case-118
          - task: structural-brain-extraction
            graded_ref: consensus_mask.nii.gz       # binary scorer, graded per case
            case: case-532
          - task: clinical-ms-lesion-segmentation
            graded_ref: lesion_mask.nii.gz          # expert reference, graded per case
            case: case-619
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install grading dependencies
        run: pip install --quiet numpy nibabel scipy huggingface_hub

      - name: Fetch reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python benchmark/harness/fetch_reference.py --task "${{ matrix.task }}" \
            ${{ matrix.case && format('--case {0}', matrix.case) || '' }}

      - name: Synthesise perfect + broken submissions from the reference
        run: |
          python - <<'PY'
          import numpy as np, nibabel as nib
          from pathlib import Path
          task="${{ matrix.task }}"; graded="${{ matrix.graded_ref }}"
          # The run names a case; the submission goes under the subject it stands for,
          # which the fetch just recorded in reference/.subject. Reading it here keeps
          # the workflow free of any subject id.
          marker = Path("benchmark/graders")/task/"reference"/".subject"
          subject = marker.read_text().strip() if marker.is_file() else ""
          ref = Path("benchmark/graders")/task/"reference"/graded
          img = nib.load(str(ref))
          # perfect = an exact copy of the graded reference -> must sit inside the
          # reference's own variability
          sub_rel = Path(task)/subject if subject else Path(task)
          good = Path("run_perfect/submissions")/sub_rel; good.mkdir(parents=True, exist_ok=True)
          nib.save(img, str(good/"output.nii.gz"))
          # broken = all-zeros on the same grid -> must trip a validity gate -> "invalid"
          bad = Path("run_broken/submissions")/sub_rel; bad.mkdir(parents=True, exist_ok=True)
          z = nib.Nifti1Image(np.zeros(img.shape, dtype="uint8"), img.affine, img.header)
          nib.save(z, str(bad/"output.nii.gz"))
          print("synthesised perfect + broken for", task)
          PY

      - name: Grade both and assert the contract
        env:
          TASK: ${{ matrix.task }}
        run: |
          mkdir -p results
          SUBJ="${{ matrix.case && format('--case {0}', matrix.case) || '' }}"
          python benchmark/harness/grade_wrapper.py grade --task "${{ matrix.task }}" $SUBJ \
            --submission-dir run_perfect --model selftest --condition perfect \
            --out results/perfect.json || true
          python benchmark/harness/grade_wrapper.py grade --task "${{ matrix.task }}" $SUBJ \
            --submission-dir run_broken --model selftest --condition broken \
            --out results/broken.json || true
          python - <<'PY'
          import json, os, sys
          from pathlib import Path

          task = os.environ["TASK"]
          p = json.load(open("results/perfect.json"))
          b = json.load(open("results/broken.json"))
          print("perfect:", p["verdict"], p["score"], p["gate_failures"],
                "| broken:", b["verdict"], b["score"], b["gate_failures"])

          # Where the reference is an expert mask its own dataset publishes, a copy of it
          # is a download rather than an answer and the grader refuses it. The probe is
          # still worth running there: it is the only check that the reference and the
          # scorer sit on the same grid, which Dice 1.0 proves, and it exercises the gate.
          policy = Path("benchmark/graders", task, "rubrics", "policy.json")
          copy_gated = (policy.is_file()
                        and json.loads(policy.read_text()).get("copy_suspect_dice") is not None)

          if copy_gated:
              ok = (p["verdict"] == "invalid" and not p["valid"]
                    and "not_reference_copy" in p["gate_failures"]
                    and abs(p["tiebreak"] - 1.0) < 1e-6)
              expected = "a copy of the reference refused, at Dice 1.0"
          else:
              ok = (p["verdict"] == "within_reference_variability" and p["valid"]
                    and p["score"] == 100.0)
              expected = "a copy of the reference scored 100 and valid"

          ok = ok and b["verdict"] == "invalid" and not b["valid"]
          if not ok:
              print(f"SELFTEST FAILED: expected {expected}, plus an invalid empty mask")
              sys.exit(1)
          print(f"SELFTEST PASSED ({expected})")
          PY

      - name: Build leaderboard from this run
        run: |
          python benchmark/harness/grade_wrapper.py aggregate \
            --glob "results/*.json" --out results/leaderboard.json

      - name: Upload self-test results
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.task }}
          path: results/*.json
